name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Unit Tests & Debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MusicoAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

  windows:
    name: Windows (xUnit Tests & WPF Release Build)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MusicoWindows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MusicoWindows.sln

      - name: Run unit tests
        run: dotnet test MusicoWindows.Tests/MusicoWindows.Tests.csproj -c Release --no-restore

      - name: Build WPF app
        run: dotnet build MusicoWindows/MusicoWindows.csproj -c Release --no-restore

      - name: Smoke-test single-file portable build
        shell: pwsh
        run: |
          $portableDir = "dist\ci-portable"
          $smokeState = "dist\ci-smoke-state"
          $smokeMusic = "dist\ci-smoke-music"
          $smokeErr = "$smokeState\smoke-error.log"

          New-Item -ItemType Directory -Force -Path $smokeState, $smokeMusic | Out-Null

          dotnet publish MusicoWindows\MusicoWindows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o $portableDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Set-Content -Path "$portableDir\portable.txt" -Value "portable" -Encoding UTF8

          $exePath = Join-Path (Resolve-Path $portableDir) "MusicoWindows.exe"
          $statePath = (Resolve-Path $smokeState).Path
          $musicPath = (Resolve-Path $smokeMusic).Path
          $errPath = Join-Path $statePath "smoke-error.log"

          $proc = Start-Process -FilePath $exePath `
            -ArgumentList "--startup-smoke-test", "--state-dir=`"$statePath`"", "--music-dir=`"$musicPath`"", "--smoke-error-file=`"$errPath`"" `
            -WorkingDirectory (Resolve-Path $portableDir).Path `
            -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill($true)
            if (Test-Path $errPath) { Get-Content $errPath }
            throw "Single-file portable MusicoWindows.exe --startup-smoke-test timed out after 60s."
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $errPath) { Get-Content $errPath }
            if (Test-Path "$statePath\crash.log") { Get-Content "$statePath\crash.log" }
            throw "Single-file portable MusicoWindows.exe --startup-smoke-test failed with exit code $($proc.ExitCode)."
          }
          Write-Host "Single-file portable startup smoke test passed."

  apple-ios-tests:
    name: Apple (iOS Simulator Tests)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Musico
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Xcode and select iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          SIM_UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort(reverse=True)
          print(f"Selected simulator: {candidates[0]}", file=sys.stderr)
          print(candidates[0][2])
          PY
          )
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

      - name: Build iOS test bundle (overlapping simulator boot)
        run: |
          set -o pipefail
          mkdir -p build
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 &
          xcodebuild -project Musico.xcodeproj -scheme Musico \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          mkdir -p build
          SIM_UDID="${{ steps.sim.outputs.udid }}"
          for attempt in 1 2 3; do
            xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$SIM_UDID" -b
            if xcodebuild -project Musico.xcodeproj -scheme Musico \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath build/DerivedData \
              -retry-tests-on-failure \
              -test-iterations 2 \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building 2>&1 | tee build/ci-test.log; then
              exit 0
            fi
            grep -Eq "failed preflight checks|RPC timeout|Early unexpected exit|XPC connection interrupted|Lost connection to the test manager" build/ci-test.log || exit 1
            xcrun simctl shutdown "$SIM_UDID" || true
            sleep 8
          done
          exit 1

  apple-catalyst-build:
    name: Apple (Mac Catalyst Build)
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Musico
    steps:
      - uses: actions/checkout@v4

      - name: Build Mac Catalyst (Release, arm64, unsigned)
        run: |
          xcodebuild -project Musico.xcodeproj -scheme Musico \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
